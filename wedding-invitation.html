  <style>
    @font-face {
      font-family: 'Alex Brush';
      src: url('/fonts/AlexBrush.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Brittany Signature';
      src: url('/fonts/BrittanySignature.woff') format('woff'),
        url('fonts/BrittanySignature.woff') format('woff'),
        url('https://fonts.cdnfonts.com/s/39082/BrittanySignature-LjyZ.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #faf6ee;
      --cream: #f3ece0;
      --blush: #f4e6e0;
      --gold: #b8985a;
      --gold-soft: #dcc9a0;
      --ink: #3b342b;
      --mute: #7d7365;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --script: 'Alex Brush', 'Great Vibes', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased
    }

    section {
      padding: clamp(72px, 14vw, 140px) 24px;
      text-align: center;
      position: relative
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto
    }

    .label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin: 0 0 28px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0
    }

    .names {
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      line-height: 1.2;
      letter-spacing: .02em
    }

    .intro-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      text-align: center;
      overflow: visible;
    }

    .script-line {
      position: relative;
      display: inline-block;
      line-height: 1.2;
      padding: 0.05em 0.8em;
      overflow: visible;
    }

    .script-text {
      display: inline-block;
      font-family: var(--script);
      font-size: clamp(3.2rem, 12.5vw, 5.2rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: .02em;
      white-space: nowrap;
      padding: 0.08em 0.3em;
      margin: -0.08em -0.3em;
      overflow: visible;
      will-change: clip-path, opacity;
    }

    .script-groom .script-text,
    .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .script-amp {
      overflow: visible;
    }

    .script-amp .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.6rem, 5.5vw, 2.3rem);
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      display: block;
      margin: 2px 0;
      transition: transform .6s ease;
    }

    .calligraphy-spark {
      position: absolute;
      top: 52%;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px #fff2a8, 0 0 16px 4px rgba(235, 205, 130, .95), 0 0 24px 6px rgba(212, 175, 55, .85);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      will-change: left, opacity;
    }

    .flourish-wrap {
      width: clamp(200px, 62vw, 300px);
      height: 24px;
      margin: .1rem auto 0;
      overflow: visible;
    }

    .calligraphy-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .intro-names.in .script-groom .script-text {
      animation: writeGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-amp .amp {
      animation: revealAmp .7s cubic-bezier(.34, 1.56, .64, 1) 1.8s forwards;
    }

    .intro-names.in .script-bride .script-text {
      animation: writeBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .flourish-path {
      animation: drawFlourish 1.1s cubic-bezier(.25, 1, .5, 1) 3.6s forwards;
    }

    @keyframes writeGroom {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveGroom {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes revealAmp {
      0% {
        opacity: 0;
        transform: scale(.6) rotate(-8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes writeBride {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveBride {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes drawFlourish {
      0% {
        stroke-dashoffset: 320;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .script-groom .script-text,
      .script-bride .script-text {
        clip-path: none !important;
        opacity: 1 !important;
        animation: none !important;
      }

      .script-amp .amp {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }

      .calligraphy-spark {
        display: none !important;
      }

      .flourish-path {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
    }

    .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.5rem, 5vw, 2rem);
      display: block;
      margin: 6px 0
    }

    .big {
      font-size: clamp(2.3rem, 7vw, 3.2rem);
      line-height: 1.15
    }

    .quote {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.3rem, 4.6vw, 1.65rem);
      line-height: 1.6;
      max-width: 30ch;
      margin: 0 auto
    }

    .body {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 4.4vw, 1.5rem);
      line-height: 1.7;
      max-width: 34ch;
      margin: 0 auto
    }

    .small {
      font-size: .85rem;
      color: var(--mute);
      letter-spacing: .04em
    }

    .alt {
      background: var(--cream)
    }

    .rule {
      height: 1px;
      width: 64px;
      background: var(--gold);
      margin: 36px auto
    }

    .orn {
      display: block;
      margin: 36px auto;
      width: 150px;
      height: 18px;
      color: var(--gold)
    }

    /* hero */
    #hero {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: radial-gradient(ellipse at 50% 40%, #fdfaf3 0%, var(--ivory) 70%)
    }

    #hero::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid var(--gold-soft);
      pointer-events: none
    }

    #hero::after {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(184, 152, 90, .25);
      pointer-events: none
    }

    .mono {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 1.05rem;
      letter-spacing: .2em;
      color: var(--gold);
      margin-bottom: 34px;
      padding-left: .2em
    }

    .date {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .14em;
      margin-top: 34px
    }

    .day {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--mute);
      margin-top: 2px
    }

    .tag {
      margin: 28px 0 38px;
      color: var(--mute);
      font-size: .9rem
    }

    .btn {
      display: inline-block;
      background: var(--ivory);
      color: var(--ink);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 14px 34px;
      font: 400 .72rem var(--sans);
      letter-spacing: .28em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      min-height: 44px;
      transition: transform .35s ease, background .35s ease, border-color .35s ease
    }

    .btn:hover {
      background: #fff;
      transform: scale(1.03);
      border-color: var(--ink)
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px
    }

    #hero {
      position: fixed;
      inset: 0;
      z-index: 20;
      transition: opacity 2.2s cubic-bezier(0.25, 1, 0.4, 1), transform 2.2s cubic-bezier(0.25, 1, 0.4, 1), visibility 2.2s;
    }

    #hero.leaving {
      opacity: 0;
      transform: scale(1.04);
      visibility: hidden;
      pointer-events: none !important;
    }

    /* Showcase preloader styles */
    .preloader-bg-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .preloader-bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      animation: preloaderKenBurns 12s ease-out forwards;
      filter: brightness(0.85) contrast(1.05);
    }

    .preloader-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center,
          rgba(14, 10, 7, 0.42) 0%,
          rgba(14, 10, 7, 0.68) 60%,
          rgba(8, 5, 3, 0.88) 100%);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
    }

    .preloader-showcase-container {
      position: relative;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 560px;
      padding: clamp(24px, 5vh, 48px) clamp(16px, 4vw, 28px);
      padding-bottom: max(calc(clamp(24px, 5vh, 40px) + env(safe-area-inset-bottom, 0px)), 32px);
      box-sizing: border-box;
      margin: auto;
      user-select: none;
      -webkit-user-select: none;
      animation: preloaderContentFadeIn 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes preloaderContentFadeIn {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .preloader-showcase-tagline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 18px);
      width: 100%;
      max-width: 380px;
      margin: 0 auto clamp(12px, 2.5vh, 22px);
    }

    .preloader-tagline-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
    }

    .preloader-tagline-text {
      font-family: var(--sans);
      font-size: clamp(0.72rem, 2.2vw, 0.85rem);
      letter-spacing: 0.36em;
      margin-right: -0.36em;
      text-transform: uppercase;
      color: #FFFFFF;
      font-weight: 500;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85), 0 0 16px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    .preloader-names-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: clamp(4px, 1.2vh, 10px) 0;
      line-height: 1.1;
    }

    .preloader-name {
      font-family: "Brittany Signature", "Alex Brush", cursive;
      font-size: clamp(3.4rem, 13vw, 5.6rem);
      font-weight: 400;
      color: #FFFFFF;
      line-height: 1.15;
      margin: 0;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.9), 0 0 28px rgba(0, 0, 0, 0.7);
      letter-spacing: 0.02em;
      padding: 0.05em 0.2em;
    }

    .preloader-amp {
      font-family: "Brittany Signature", "Alex Brush", cursive;
      font-size: clamp(1.8rem, 6.5vw, 2.8rem);
      font-style: italic;
      color: #FFFFFF;
      line-height: 1;
      margin: -8px 0;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }

    .preloader-heart-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 16px);
      width: 100%;
      max-width: 220px;
      margin: clamp(12px, 2.2vh, 18px) auto clamp(10px, 1.8vh, 14px);
    }

    .preloader-heart-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
    }

    .preloader-heart-icon {
      width: clamp(12px, 3.2vw, 16px);
      height: clamp(12px, 3.2vw, 16px);
      fill: #FFFFFF;
      opacity: 0.92;
      filter: drop-shadow(0 1px 6px rgba(0, 0, 0, 0.85));
    }

    .preloader-showcase-date {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: clamp(1.1rem, 3.8vw, 1.45rem);
      color: #FFFFFF;
      letter-spacing: 0.06em;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      font-weight: 400;
    }

    .preloader-open-bottom {
      margin-top: clamp(22px, 4.5vh, 34px);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      z-index: 30;
    }

    .preloader-open-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 48px;
      min-width: 140px;
      padding: 11px 28px;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 9999px;
      color: #FFFFFF;
      font-family: var(--sans);
      font-size: clamp(0.78rem, 2.2vw, 0.88rem);
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.5), 0 0 16px rgba(255, 255, 255, 0.35);
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      animation: preloaderBtnPulse 2.8s ease-in-out infinite;
      text-decoration: none;
    }

    @keyframes preloaderBtnPulse {
      0%, 100% {
        box-shadow: 0 4px 22px rgba(0, 0, 0, 0.5), 0 0 16px rgba(255, 255, 255, 0.35);
        border-color: rgba(255, 255, 255, 0.9);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 6px 28px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 255, 255, 0.7);
        border-color: #FFFFFF;
        transform: scale(1.03);
      }
    }

    .preloader-open-pill-btn:hover {
      transform: scale(1.04);
      background: rgba(255, 255, 255, 0.32);
      box-shadow: 0 6px 26px rgba(0, 0, 0, 0.55), 0 0 24px rgba(255, 255, 255, 0.75);
    }

    .preloader-open-pill-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.4);
    }

    .arch {
      width: min(34vw, 160px, calc(22svh*.75));
      aspect-ratio: 3/4;
      border: 1px solid var(--gold);
      border-radius: 999px 999px 6px 6px;
      padding: 5px;
      margin-bottom: clamp(18px, 4svh, 32px)
    }

    .arch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 34%;
      border-radius: 999px 999px 3px 3px
    }

    /* cover */
    #intro {
      padding-top: 0;
      padding-left: 0;
      padding-right: 0;
    }

    #intro .wrap {
      padding-left: 24px;
      padding-right: 24px;
    }

    .cover {
      width: 100%;
      max-width: 640px;
      margin: 0 auto -44px;
      aspect-ratio: 3/4;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 28%;
      transform: scale(1.03);
      transition: transform 2.6s ease;
    }

    .cover.in img {
      transform: none
    }

    @media (min-width: 768px) {
      .cover {
        width: 100%;
        max-width: 100%;
        height: 100vh;
        min-height: 100vh;
        aspect-ratio: auto;
        margin: 0 auto;
        -webkit-mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
      }

      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 22%;
      }

      #intro .wrap {
        margin-top: clamp(36px, 6vw, 72px);
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .cover img {
        transition: none;
        transform: none
      }
    }

    /* gallery */
    .gal {
      position: relative;
      max-width: 580px;
      margin: 0 auto;
      padding-bottom: 0;
      text-align: center;
    }

    .ph {
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 10px 32px rgba(60, 50, 30, .14);
      background: var(--cream);
      border: 1px solid var(--gold-soft);
    }

    .ph img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform 2.6s ease;

                <img src="${PHOTOS.gallery}" alt="${W.groom} and ${W.bride}" class="rolling-photo photo-0" loading="lazy" decoding="async" />
              </div>
            </div>

            <div class="rolling-card" data-index="1">
              <div class="rolling-card-inner">
                <img src="${PHOTOS.gallery1}" alt="${W.groom} and ${W.bride}" class="rolling-photo photo-1" loading="lazy" decoding="async" />
              </div>
            </div>

            <div class="rolling-card" data-index="2">
              <div class="rolling-card-inner">
                <img src="${PHOTOS.gallery2}" alt="${W.groom} and ${W.bride}" class="rolling-photo photo-2" loading="lazy" decoding="async" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section style="padding-block:clamp(100px,22vw,200px)"><div class="wrap">
  <h2 class="names r" style="font-size:clamp(2.2rem,9vw,3.4rem)">${W.short}</h2>
  <p class="serif r" style="font-size:1.4rem;letter-spacing:.2em;margin-top:24px">${D.dots}</p>
  <div class="rule line-x r"></div>
  <p class="quote r">Together, forever begins here.</p>
  <p class="small r" style="margin-top:28px">With love and blessings</p>
  ${orn}
</div></section>`;

    function coupleCard(person) {
      return `<div class="r couple-card">
  <h3 class="couple-name">${person.name}</h3>
  <div class="couple-rule line-x"></div>
  <p class="couple-sentence"><span class="relation-tag">${person.relation}</span> ${person.father} &amp; ${person.mother}</p>
  ${person.address ? `<p class="couple-address">${person.address}</p>` : ''}
</div>`;
    }
    document.getElementById('fmono').textContent = W.footMono;
    document.getElementById('fdate').textContent = D.dotted;

    /* ===== Wedding Countdown Timer ===== */
    (function initCountdown() {
      const target = new Date('2026-11-16T11:00:00+05:30').getTime();
      const elD = document.getElementById('cd-days');
      const elH = document.getElementById('cd-hours');
      const elM = document.getElementById('cd-minutes');
      const elS = document.getElementById('cd-seconds');
      if (!elD || !elH || !elM || !elS) return;
      function tick() {
        const diff = target - Date.now();
        if (diff <= 0) {
          elD.textContent = '00'; elH.textContent = '00'; elM.textContent = '00'; elS.textContent = '00';
          return;
        }
        const s = Math.floor(diff / 1000);
        elD.textContent = String(Math.floor(s / 86400));
        elH.textContent = String(Math.floor((s % 86400) / 3600)).padStart(2, '0');
        elM.textContent = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
        elS.textContent = String(s % 60).padStart(2, '0');
      }
      tick();
      setInterval(tick, 1000);
    })();

    /* ===== 3D Rolling Gallery Logic (Pure Images & Scroll-Driven) ===== */
    (function initRollingGallery() {
      const track = document.getElementById('rolling-gallery-track');
      const stage = document.getElementById('rolling-stage');
      const cards = document.querySelectorAll('.rolling-card');

      if (!track || !stage || cards.length === 0) return;

      let currentIndex = 0;
      const total = cards.length;
      let isProgrammatic = false;

      function updateCard(newIndex) {
        if (newIndex < 0 || newIndex >= total) return;
        cards.forEach((card, i) => {
          card.classList.remove('active', 'rolled-out', 'rolled-back');
          if (i === newIndex) {
            card.classList.add('active');
          } else if (i < newIndex) {
            card.classList.add('rolled-out');
          } else {
            card.classList.add('rolled-back');
          }
        });
        currentIndex = newIndex;
      }

      function handleScroll() {
        if (isProgrammatic) return;
        const rect = track.getBoundingClientRect();
        const trackHeight = track.offsetHeight;
        const maxScroll = trackHeight - window.innerHeight;
        if (maxScroll <= 0) return;
        const progress = Math.min(Math.max(-rect.top / maxScroll, 0), 1);
        let targetIndex = Math.min(Math.floor(progress * total), total - 1);
        if (targetIndex !== currentIndex) {
          updateCard(targetIndex);
        }
      }

      window.addEventListener('scroll', handleScroll, { passive: true });

      function scrollToCard(targetIndex) {
        updateCard(targetIndex);
        const rect = track.getBoundingClientRect();
        const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
        const trackTop = currentScrollY + rect.top;
        const maxScroll = track.offsetHeight - window.innerHeight;
        if (maxScroll > 0) {
          isProgrammatic = true;
          const targetScroll = trackTop + (targetIndex / (total - 1)) * maxScroll;
          window.scrollTo({ top: targetScroll, behavior: 'smooth' });
          setTimeout(() => { isProgrammatic = false; }, 700);
        }
      }

      let touchStartX = 0, touchStartY = 0;
      stage.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      stage.addEventListener('touchend', e => {
        if (e.changedTouches.length === 1) {
          const deltaX = e.changedTouches[0].clientX - touchStartX;
          const deltaY = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(deltaX) > 40 && Math.abs(deltaX) > Math.abs(deltaY)) {
            if (deltaX < 0 && currentIndex < total - 1) scrollToCard(currentIndex + 1);
            else if (deltaX > 0 && currentIndex > 0) scrollToCard(currentIndex - 1);
          }
        }
      }, { passive: true });
    })();

    /* ===== Scroll reveal ===== */
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .08, rootMargin: '0px 0px -4% 0px' });
    document.querySelectorAll('.r').forEach(el => io.observe(el));

    /* ===== Prelude: guest taps Open Invitation to enter ===== */
    history.scrollRestoration = 'manual'; scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
    let opened = false;
    function openInvite() {
      if (opened) return; opened = true;
      document.documentElement.style.overflow = ''; document.body.style.overflow = '';
      scrollTo(0, 0);
      document.getElementById('hero').classList.add('leaving');
      document.querySelectorAll('.r').forEach(el => io.observe(el));
      playAudio();
      setTimeout(() => {
        const inames = document.querySelector('.intro-names');
        if (inames) inames.classList.add('in');
      }, 450);
      initRosePetals();
    }
    document.querySelector('#hero .btn').addEventListener('click', e => { e.preventDefault(); openInvite() });

    /* ===== Background Music Playback ===== */
    const audio = document.getElementById('wedding-audio');
    const TARGET_AUDIO_VOLUME = 0.28;

    function playAudio() {
      if (!audio) return;
      audio.volume = 0.05;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          let vol = 0.05;
          const fadeTimer = setInterval(() => {
            vol = Math.min(TARGET_AUDIO_VOLUME, vol + 0.03);
            if (audio) audio.volume = vol;
            if (vol >= TARGET_AUDIO_VOLUME) clearInterval(fadeTimer);
          }, 70);
        }).catch(err => {
          console.log("Audio waiting for user gesture:", err);
          const resume = () => {
            audio.volume = TARGET_AUDIO_VOLUME;
            audio.play().catch(() => { });
            window.removeEventListener('click', resume);
            window.removeEventListener('touchstart', resume);
          };
          window.addEventListener('click', resume, { once: true });
          window.addEventListener('touchstart', resume, { once: true });
        });
      }
    }

    /* ===== Falling Rose Petals (Confined to .cover only, small 3D) ===== */
    let petalsActive = false;
    function initRosePetals() {
      if (petalsActive) return;
      petalsActive = true;
      const cover = document.querySelector('.cover');
      if (!cover) return;

      const ROSE_PALETTES = [
        { front: ['#a81b2c', '#c72438', '#7a0e1c'], back: ['#580812', '#720c19'] },
        { front: ['#921424', '#b51d31', '#6b0b17'], back: ['#4b060e', '#610a14'] },
        { front: ['#ba2136', '#db324b', '#8f1224'], back: ['#630a17', '#7c1020'] },
        { front: ['#d94d65', '#eb6880', '#ad3249'], back: ['#8c1e32', '#a82941'] },
        { front: ['#82101e', '#9e1728', '#5e0813'], back: ['#3e040a', '#540710'] }
      ];
      let canvas = document.getElementById('rose-petals-canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = 'rose-petals-canvas';
        canvas.setAttribute('aria-hidden', 'true');
        document.body.appendChild(canvas);
      } else if (canvas.parentElement !== document.body) {
        document.body.appendChild(canvas);
      }
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '50';
      canvas.style.opacity = '0';
      canvas.style.transition = 'opacity 1.5s ease';

      requestAnimationFrame(() => { canvas.style.opacity = '1'; });
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let width = window.innerWidth;
      let height = window.innerHeight;
      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = '100vw';
        canvas.style.height = '100vh';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize, { passive: true });

      function spawnPetal(initial) {
        const depth = Math.random();
        // Tiny 3D delicate petals: 4.5px to 10px
        const size = depth < 0.35 ? 4.5 + Math.random() * 1.8 : (depth < 0.8 ? 6.2 + Math.random() * 2.0 : 8.2 + Math.random() * 2.2);
        const speedY = depth < 0.35 ? 0.22 + Math.random() * 0.14 : (depth < 0.8 ? 0.30 + Math.random() * 0.16 : 0.38 + Math.random() * 0.18);
        return {
          x: Math.random() * (width + 40) - 20,
          y: initial ? Math.random() * (height + 40) - 20 : -18 - Math.random() * 25,
          size,
          aspect: 0.70 + Math.random() * 0.16,
          speedY,
          speedX: -0.08 + Math.random() * 0.18,
          angle: Math.random() * Math.PI * 2,
          angleSpeed: (Math.random() - 0.5) * 0.006,
          flip: Math.random() * Math.PI * 2,
          flipSpeed: 0.007 + Math.random() * 0.012,
          pitch: Math.random() * Math.PI * 2,
          pitchSpeed: 0.009 + Math.random() * 0.014,
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: 0.006 + Math.random() * 0.009,
          swayAmp: 7 + Math.random() * 10,
          curl: (Math.random() - 0.5) * 0.6,
          palette: ROSE_PALETTES[Math.floor(Math.random() * ROSE_PALETTES.length)],
          opacity: 0.7 + Math.random() * 0.25
        };
      }

      const count = width < 768 ? 16 : 22;
      const petals = [];
      for (let i = 0; i < count; i++) petals.push(spawnPetal(true));

      let lastTime = performance.now();
      let animId = null;

      function drawPetal(p) {
        const w = p.size * p.aspect;
        const h = p.size;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        const flipCos = Math.cos(p.flip);
        const pitchSin = Math.sin(p.pitch);
        ctx.scale(flipCos, 0.93 + pitchSin * 0.07);
        ctx.globalAlpha = p.opacity;
        const isBack = flipCos < 0;
        const colors = isBack ? p.palette.back : p.palette.front;
        const grad = ctx.createLinearGradient(-w * 0.5, -h * 0.5, w * 0.5, h * 0.5);
        grad.addColorStop(0, colors[0]);
        grad.addColorStop(0.5, colors[1]);
        grad.addColorStop(1, colors[colors.length - 1]);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, h * 0.48);
        ctx.bezierCurveTo(-w * 0.58, h * 0.22, -w * 0.65, -h * 0.22, -w * 0.22, -h * 0.48);
        ctx.bezierCurveTo(-w * 0.08, -h * 0.51, w * 0.08, -h * 0.51, w * 0.22, -h * 0.48);
        ctx.bezierCurveTo(w * 0.65, -h * 0.22, w * 0.58, h * 0.22, 0, h * 0.48);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = isBack ? 'rgba(255, 190, 190, 0.14)' : 'rgba(255, 240, 240, 0.22)';
        ctx.lineWidth = Math.max(0.4, w * 0.04);
        ctx.beginPath();
        ctx.moveTo(0, h * 0.42);
        ctx.quadraticCurveTo(p.curl * w * 0.22, 0, 0, -h * 0.38);
        ctx.stroke();
        ctx.restore();
      }

      function loop(now) {
        const dt = Math.min((now - lastTime) / 16.667, 2.0);
        lastTime = now;
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < petals.length; i++) {
          const p = petals[i];
          const sway = Math.cos(now * 0.001 * p.swaySpeed + p.swayPhase) * (p.swayAmp * 0.022);
          p.y += p.speedY * dt;
          p.x += (p.speedX + 0.05 + sway) * dt;
          p.angle += p.angleSpeed * dt;
          p.flip += p.flipSpeed * dt;
          p.pitch += p.pitchSpeed * dt;
          if (p.y > height + 25) {
            p.y = -15 - Math.random() * 25;
            p.x = Math.random() * (width + 40) - 20;
          }
          if (p.x < -30) p.x = width + 20;
          else if (p.x > width + 30) p.x = -20;
          drawPetal(p);
        }
        animId = requestAnimationFrame(loop);
      }

      if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
        animId = requestAnimationFrame(loop);
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            if (animId) cancelAnimationFrame(animId);
          } else {
            lastTime = performance.now();
            animId = requestAnimationFrame(loop);
          }
        });
      }
  </script>
